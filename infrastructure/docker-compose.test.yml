version: "3.8"

services:
  # --- MICROSERVICIO REAL DE INTEGRACIÓN (MODO TEST QA) ---
  app:
    build:
      context: ../                          
      dockerfile: infrastructure/Dockerfile  
      target: final
    container_name: smartsupervision-app-test
    ports:
      - "8000:8000"
    volumes:
      - ../:/code                           
    env_file:
      - .env.test
    environment:
      # Forzamos entorno QA para que no ejecute retornos simulados/mock
      - ENVIRONMENT=qa
      # La app dentro de Docker se comunica con MinIO usando el nombre del servicio
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - minio

  # --- EMULADOR DE AWS S3 (MINIO) ---
  minio:
    image: minio/minio:latest
    container_name: minio-s3-local
    ports:
      - "9000:9000"   # Puerto para la API de S3 (boto3)
      - "9001:9001"   # Puerto para la Consola Web de administración
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: