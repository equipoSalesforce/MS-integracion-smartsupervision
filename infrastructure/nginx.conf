events {
    worker_connections 1024;
}

http {
    # 🔍 DNS Interno de Docker para resolución dinámica de contenedores
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream fastapi_cluster {
        least_conn; # Envía tráfico a la instancia con menos conexiones activas
        server app:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_cluster;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ⏱️ Timeouts altos para aguantar ráfagas sin romper conexión
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}