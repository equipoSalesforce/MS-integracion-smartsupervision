version: "3.8"

services:
  # ======================================================================
  # 🌐 1. SERVICIO API WEB (FastAPI - Stateless)
  # ======================================================================
  app:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
      target: final
    image: ms-integracion-smartsupervision:latest
    container_name: sfc-api-app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_SCHEDULER=false   # 👈 Desactivado en la API para permitir Auto Scaling libre
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================================================================
  # ⚙️ 2. SERVICIO WORKER DEDICADO (APScheduler + Cola Redis)
  # ======================================================================
  worker:
    image: ms-integracion-smartsupervision:latest
    container_name: sfc-worker-app
    command: ["python", "-m", "app.worker"] # 👈 Punto de entrada independiente
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_SCHEDULER=true    # 👈 Única instancia encargada del scheduler y reintentos
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  # ======================================================================
  # 📦 3. COLA CENTRALIZADA REDIS (Para entornos DEV / EC2)
  # Nota: En AWS Producción/Staging se conecta a AWS ElastiCache
  # ======================================================================
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_dev_data: