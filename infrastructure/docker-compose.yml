version: "3.8"

services:
  # ======================================================================
  # 🚀 MICROSERVICIO PRINCIPAL DE INTEGRACIÓN SMART SUPERVISIÓN
  # ======================================================================
  app:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
      target: final
    image: ms-integracion-smartsupervision:latest
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================================================================
  # 📦 COLA CENTRALIZADA REDIS (Para entornos DEV en EC2)
  # Nota: En AWS Producción/Staging, se reemplaza por AWS ElastiCache
  # ======================================================================
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_dev_data: