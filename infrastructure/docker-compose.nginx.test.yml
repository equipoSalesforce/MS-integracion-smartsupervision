version: "3.8"

services:
  # --- BALANCEADOR DE CARGA / LOAD BALANCER (NGINX) ---
  loadbalancer:
    image: nginx:alpine
    container_name: nginx-lb-local
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  # --- API HTTP (REPLICABLE) ---
  app:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
      target: final-api          # 👈 antes: final
    image: ms-integracion-smartsupervision-api:latest
    env_file:
      - .env.test
    environment:
      - ENVIRONMENT=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_ACCESS_KEY_ID                      
      - AWS_SECRET_ACCESS_KEY                  
      - AWS_SESSION_TOKEN
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # healthcheck: heredado de la imagen final-api (HTTP /health/live)

  # --- WORKER DE PROCESAMIENTO (REPLICABLE) ---
  worker:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
      target: final-worker       # 👈 antes: final (por eso heredaba el healthcheck HTTP)
    image: ms-integracion-smartsupervision-worker:latest
    env_file:
      - .env.test
    environment:
      - ENVIRONMENT=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_ACCESS_KEY_ID                      
      - AWS_SECRET_ACCESS_KEY                  
      - AWS_SESSION_TOKEN                      
    command: ["python", "-m", "app.worker"]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # healthcheck: heredado de la imagen final-worker (heartbeat file, no HTTP)

  # --- EMULADOR DE AWS S3 (MINIO) ---
  minio:
    image: minio/minio:latest
    container_name: minio-s3-local
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- COLA CENTRALIZADA (REDIS) ---
  redis:
    image: redis:7-alpine
    container_name: redis-queue-local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  minio_data:
  redis_data: