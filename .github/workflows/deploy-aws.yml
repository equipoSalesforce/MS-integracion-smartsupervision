# =============================================================================
# EJEMPLO de CI/CD para desplegar MS Integración SmartSupervision (SSV) a ECS
# =============================================================================
# Este workflow es un PUNTO DE PARTIDA, no un pipeline listo para producción.
# Antes de usarlo hay que:
#
#   1. Crear el rol de IAM para OIDC de GitHub (`AWS_DEPLOY_ROLE_ARN`). Debe incluir
#      secretsmanager:DescribeSecret sobre el ARN real del secreto que entrega la
#      Variable SECRETS_MANAGER_SECRET_NAME (ver punto 2) para que el render pueda
#      resolver el sufijo real del secreto (ya no se pasa manualmente por
#      SECRET_SUFFIX ni se asume su nombre), ecs:RunTask + ecs:DescribeTasks (scopeados
#      al cluster compartido) para el smoke funcional post-deploy (ver sección
#      "Smoke post-deploy" más abajo), además de los permisos ECR/ECS habituales
#      para build-and-push/deploy (ecr:*, ecs:RegisterTaskDefinition,
#      ecs:UpdateService, ecs:DescribeServices, iam:PassRole sobre los roles de
#      ejecución/tarea de abajo). SSV corre dentro del cluster/ALB COMPARTIDOS de
#      CRM Global66 (no recursos dedicados), así que este rol NO necesita
#      elasticache:DescribeReplicationGroups ni
#      elasticloadbalancing:DescribeLoadBalancers -- ECS_CLUSTER_NAME y
#      SSV_SMOKE_BASE_URL llegan ya resueltos como Variables de GitHub (ver punto 2).
#   1b. Crear el Execution Role y el Task Role (uno por ambiente) que referencia
#      infrastructure/ecs-task-def.json.tpl. Los ARN de ambos los entrega el IaC
#      central como las Variables de GitHub ECS_EXECUTION_ROLE_ARN y
#      ECS_TASK_ROLE_ARN (ver job `deploy` más abajo) -- este repo no asume su
#      nombre ni que sea el mismo en todos los ambientes (el Task Role SÍ lo asumía
#      antes, hardcodeado como "msSmartsupervisionTaskRole-${ENVIRONMENT}" en la
#      plantilla -- el mismo problema que ya se había corregido para el Execution
#      Role). Cada rol tiene una responsabilidad distinta -- NO intercambiar los
#      permisos entre ellos:
#        - Execution Role: lo usa el agente de ECS ANTES de que la app corra (pull
#          de imagen en ECR + resolver los `secrets` del task def contra Secrets
#          Manager +, vía el driver `awslogs`, enviar logs a CloudWatch). Ver
#          infrastructure/ms-smartsupervision-execution-role-policy.json.tpl como
#          permisos adicionales sobre la política administrada estándar
#          AmazonECSTaskExecutionRolePolicy (que ya cubre ECR + logs:CreateLogStream/
#          PutLogEvents; el añadido real es secretsmanager:GetSecretValue). El log
#          group en sí NO lo crea este rol ni la app (`awslogs-create-group: false`
#          en el task def) -- debe existir de antemano, creado por Terraform.
#        - Task Role: lo asume la app ya corriendo, para lo que ella misma llama
#          por SDK -- hoy sólo S3 (confirmado: la app nunca llama a Secrets Manager
#          ni a la API de CloudWatch Logs directamente). Ver
#          infrastructure/ms-smartsupervision-task-role-policy.json.tpl. El
#          ${AWS_S3_BUCKET} de esa política NO lo fija este repo -- debe ser
#          sustituido por Terraform con el nombre/ARN real del bucket que ya existe
#          en ese ambiente (mismo output/convención que alimenta la GitHub Variable
#          AWS_S3_BUCKET usada en el job deploy más abajo). Terraform es la única
#          fuente de verdad para ese nombre; este repo no asume ninguna convención
#          de nomenclatura entre ambientes.
#   2. SSV se despliega DENTRO del cluster ECS y del ALB ya existentes de CRM
#      Global66 (compartidos con otros servicios, no recursos dedicados a SSV).
#      El repo central de infraestructura (NO este repo) debe tener ya
#      provisionados: ECR, el cluster ECS compartido, los servicios ECS
#      "api"/"worker" de SSV dentro de ese cluster, ElastiCache, Secrets Manager
#      (el secreto compuesto con las credenciales de la app), los log groups de
#      api/worker, las reglas de routing del ALB compartido hacia el target group
#      de SSV, SG y networking. Ninguno de esos nombres lo asume este repo -- todos
#      llegan como Variables de GitHub que entrega el IaC central: ECS_CLUSTER_NAME,
#      SSV_SMOKE_BASE_URL, ECR_REPOSITORY_NAME, ECS_SERVICE_NAME_API,
#      ECS_SERVICE_NAME_WORKER, ECS_LOG_GROUP_API, ECS_LOG_GROUP_WORKER y
#      SECRETS_MANAGER_SECRET_NAME (antes varios de éstos estaban hardcodeados en la
#      plantilla/workflow asumiendo la convención de nombres del IaC central; un
#      desalineamiento sólo se descubría a mitad de un despliegue real). El
#      Security Group del ALB debe permitir entrada 443 desde el SG que se use en
#      ECS_SECURITY_GROUP_IDS (abajo), para que la task efímera del smoke pueda
#      alcanzarlo. Este workflow NO crea infraestructura — sólo construye, publica
#      y despliega la aplicación sobre infraestructura que ya existe.
#   3. Configurar los secrets/variables listados en cada job (Settings →
#      Secrets and variables → Actions), incluyendo ECS_CLUSTER_NAME,
#      SSV_SMOKE_BASE_URL, REDIS_HOST, ECR_REPOSITORY_NAME, ECS_TASK_ROLE_ARN,
#      ECS_SERVICE_NAME_API, ECS_SERVICE_NAME_WORKER, ECS_LOG_GROUP_API,
#      ECS_LOG_GROUP_WORKER, SECRETS_MANAGER_SECRET_NAME, y dos Variables para el smoke post-deploy:
#      ECS_SUBNET_IDS y ECS_SECURITY_GROUP_IDS, cada una como un array JSON de
#      strings (ej. '["subnet-0123...", "subnet-0abc..."]'), subnets/SG privados
#      de la misma VPC donde corren los servicios api/worker.
#
# Smoke post-deploy (auditoría adversarial v10, P1-03/P1-05):
#   `aws ecs wait services-stable` sólo prueba que ECS cree que las tasks están
#   sanas -- no que el negocio funcione. Después de que api y worker estabilizan,
#   el job `deploy` lanza una task efímera (misma imagen ya en ECR, mismo Task
#   Role que el servicio api -- sin IAM nuevo para la app) que corre
#   scripts/post_deploy_smoke.py: valida Redis pegándole a
#   /api/v1/quejas/_health/ready A TRAVÉS del ALB compartido con CRM (de punta a
#   punta: routing + target group + contenedor + Redis) y S3 con un head_bucket
#   real usando las credenciales del Task Role. Se usa esa ruta propia de SSV (y
#   no /health/ready) y se valida el campo "servicio" del body porque, al ser el
#   ALB compartido, un 200 genérico no confirma que la respuesta venga del
#   target group de SSV. Si el smoke falla, se revierten AMBOS servicios (api y
#   worker) a su revisión previa -- el mismo mecanismo de rollback coordinado
#   que ya protege contra un fallo de estabilización. Login SFC queda fuera de
#   este alcance a propósito (ver discusión P1-05: exigiría un executionRole
#   propio con acceso a Secrets Manager para la task efímera).
#
# Estructura:
#   test               -> corre siempre (push y pull_request), incluye el
#                          render de ambas Task Definitions validado contra el
#                          shape real de RegisterTaskDefinition (P1-02)
#   docker-build-smoke  -> corre en push/pull_request (no en workflow_dispatch);
#                          construye final-api y final-worker sin publicar (P1-01)
#   build-and-push      -> sólo en despliegue manual (workflow_dispatch)
#   deploy              -> registra ambas Task Definitions (api + worker) antes
#                          de tocar cualquier servicio, despliega API y luego
#                          worker verificando la revisión real desplegada, corre
#                          el smoke funcional post-deploy, y revierte AMBOS
#                          servicios a su revisión previa si cualquiera de esos
#                          pasos falla -- nunca deja una mezcla de versiones
#                          entre los dos servicios ni una release "stable" pero
#                          funcionalmente rota
# =============================================================================

name: Deploy SSV a AWS ECS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de despliegue"
        required: true
        type: choice
        # 🟢 FIX P1-01 (auditoría adversarial v9): el renderer (render_task_def.py) ya
        # soporta "ci" como ambiente, pero no aparecía como opción manual aquí — con
        # el objetivo de montar primero SSV en CI, hacía falta poder desplegarlo sin
        # forzar dev/qa/prod. Requiere definir el GitHub Environment "ci" (Settings →
        # Environments) con sus vars/secrets propios antes de usarlo.
        options: [ci, dev, qa, prod]
        default: dev

permissions:
  id-token: write   # requerido para autenticación OIDC con AWS (sin access keys estáticas)
  contents: read

# 🟢 FIX (revisión despliegue AWS): sin esto, dos ejecuciones de workflow_dispatch
# contra el mismo ambiente (ej. dos personas desplegando 'dev' a la vez) podían pisarse
# entre sí -- registrar Task Definitions y hacer update-service en paralelo sobre el
# mismo servicio ECS. Se serializa por ambiente (los runs de test por push/PR se agrupan
# por rama en vez de compartir un único grupo, para no bloquearse entre PRs distintos) y
# el más nuevo espera en cola -- nunca cancela uno ya en curso, para no interrumpir un
# `aws ecs wait` a mitad de despliegue.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('deploy-ssv-{0}', inputs.environment) || format('deploy-ssv-test-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 1. TESTS — corre en cada push/PR, nunca despliega nada.
  # ===========================================================================
  test:
    name: Suite de pruebas
    runs-on: ubuntu-latest

    # Redis real disponible para tests/test_queue_race_protection.py (verifica
    # las protecciones de ownership/versión de la cola contra Redis de verdad,
    # no un mock — ver ese archivo para el porqué).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 🟢 FIX P0-04 (auditoría adversarial v9): en un runner limpio (checkout nuevo, sin
      # .env local) Settings() exige 12 variables sin default y aborta el import de
      # cualquier módulo que toque app.core.config — la suite ni siquiera llega a
      # correr. Estos son valores explícitamente ficticios, sólo para que el test job
      # pueda construir Settings(); ningún test habla con servicios reales usándolos.
      # GOOGLE_SPREADSHEET_ID/GOOGLE_CATALOGS_SPREADSHEET_ID también se fijan aquí:
      # sin ellos, tests/test_single_flight_refresh.py omite la rama que llama a
      # Google OAuth (es opcional en Settings) y el mock nunca se invoca, fallando la
      # aserción de call_count aunque las 12 variables obligatorias ya estén presentes.
      - name: Ejecutar suite completa (unittest)
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: test
          CRM_CORS_ORIGINS: "*"
          AWS_S3_BUCKET: test-smartsupervision-attachments
          AWS_REGION: us-east-1
          SFC_URL_BASE: https://qasmart.superfinanciera.gov.co
          SFC_USERNAME: test_sfc_user
          SFC_PASSWORD: test_sfc_password
          SFC_SECRET_KEY: test_sfc_secret_key_12345
          CRM_API_KEY: g66_sk_test_super_secreto_12345
          ADMIN_API_KEY: g66_sk_test_admin_secreto_99999
          SMTP_USER: test@example.com
          SMTP_PASSWORD: test_password
          ALERT_NOTIFY_EMAILS: test@example.com
          CRM_WEBHOOK_API_KEY: test_crm_webhook_key
          CRM_WEBHOOK_URL: https://localhost/test-webhook
          GOOGLE_SPREADSHEET_ID: test_spreadsheet_id
          GOOGLE_CATALOGS_SPREADSHEET_ID: test_catalogs_spreadsheet_id
        run: python -m unittest discover -s tests

  # ===========================================================================
  # 1b. DOCKER BUILD SMOKE — corre en cada push/PR (auditoría adversarial v10,
  #     P1-01): antes, `docker build` sólo corría en workflow_dispatch (dentro de
  #     build-and-push), así que un Dockerfile roto podía mergearse con tests en
  #     verde y sólo se descubría al intentar desplegar. No publica nada -- sólo
  #     construye ambos targets para detectar la regresión temprano. No corre en
  #     workflow_dispatch porque build-and-push ya hace el build real (con push)
  #     para ese caso.
  # ===========================================================================
  docker-build-smoke:
    name: Build Docker (smoke, sin publicar)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen API (smoke, target final-api)
        run: |
          docker build --target final-api -f infrastructure/Dockerfile \
            -t ssv-smoke-api:${{ github.sha }} .

      - name: Build imagen Worker (smoke, target final-worker)
        run: |
          docker build --target final-worker -f infrastructure/Dockerfile \
            -t ssv-smoke-worker:${{ github.sha }} .

  # ===========================================================================
  # 2. BUILD & PUSH — sólo en despliegue manual. Construye UNA imagen
  #    (target final-api) reutilizada para ambos servicios (api y worker): la
  #    Task Definition de ECS sobreescribe `command` y `healthCheck` por
  #    contenedor, así que el mismo artefacto sirve para los dos roles — ver
  #    infrastructure/ecs-task-def.json.tpl, que ya referencia una única
  #    imagen/tag para ambos.
  # ===========================================================================
  build-and-push:
    name: Build y push a ECR
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag inmutable (commit SHA corto)
        id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciales AWS (OIDC, sin access keys estáticas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen (target final-api)
        run: |
          docker build \
            --target final-api \
            -f infrastructure/Dockerfile \
            -t "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ steps.vars.outputs.image_tag }}" \
            .

      # Gate de seguridad: la auditoría exige "scan on push" y cero críticas
      # no aceptadas. Si el repo ECR ya tiene scanOnPush=true, este paso sólo
      # consulta el resultado y falla el build si hay CRITICAL sin aceptar.
      - name: Push a ECR
        run: |
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ steps.vars.outputs.image_tag }}"

      - name: Verificar hallazgos críticos del scan de ECR
        run: |
          python scripts/wait_ecr_scan.py \
            --repository-name "${{ vars.ECR_REPOSITORY_NAME }}" \
            --image-tag "${{ steps.vars.outputs.image_tag }}" \
            --region "${{ vars.AWS_REGION }}" \
            --retry-interval-seconds 5 \
            --timeout-seconds 300

  # ===========================================================================
  # 3. DEPLOY — renderiza ambas Task Definitions (api + worker) con el script
  #    ya existente (scripts/render_task_def.py, con sus validaciones
  #    fail-fast) y actualiza los dos servicios ECS, esperando a que el
  #    circuit breaker de despliegue confirme estabilidad o revierta.
  # ===========================================================================
  deploy:
    name: Desplegar a ECS (${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SFC_URL_BASE: ${{ vars.SFC_URL_BASE }}
      CRM_CORS_ORIGINS: ${{ vars.CRM_CORS_ORIGINS }}
      # SSV corre dentro del cluster/ALB compartidos de CRM Global66 -- estos tres
      # valores los entrega el IaC central como Variables del Environment, no se
      # derivan de un patrón de nombre propio de SSV (ver cabecera del workflow).
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      SSV_SMOKE_BASE_URL: ${{ vars.SSV_SMOKE_BASE_URL }}
      REDIS_HOST: ${{ vars.REDIS_HOST }}
      REDIS_CLUSTER_MODE: ${{ vars.REDIS_CLUSTER_MODE }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      # El Execution Role lo crea el IaC central por ambiente -- este repo ya no
      # asume el nombre fijo "ecsTaskExecutionRole" (ver infrastructure/
      # ms-smartsupervision-execution-role-policy.json.tpl para los permisos que
      # ese rol necesita).
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      # 🟢 FIX (auditoría nombres de recursos AWS): mismo problema del Execution Role
      # aplicaba al Task Role, al repo ECR y a los log groups -- estaban hardcodeados
      # en la plantilla/workflow asumiendo un nombre que el IaC central debía adivinar.
      # Los cuatro pasan a ser Variables de GitHub, sin ninguna convención de nombre
      # asumida por este repo.
      ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
      ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
      ECS_LOG_GROUP_API: ${{ vars.ECS_LOG_GROUP_API }}
      ECS_LOG_GROUP_WORKER: ${{ vars.ECS_LOG_GROUP_WORKER }}
      ECS_SERVICE_NAME_API: ${{ vars.ECS_SERVICE_NAME_API }}
      ECS_SERVICE_NAME_WORKER: ${{ vars.ECS_SERVICE_NAME_WORKER }}
      # El nombre del secreto compuesto ("{environment}/smartsupervision/app-secrets")
      # también estaba hardcodeado -- esa convención la decide quien crea el secreto
      # (el plan de Terraform), no este repo. render_task_def.py ya no la reconstruye,
      # sólo consulta el sufijo real contra el nombre exacto que llega aquí.
      SECRETS_MANAGER_SECRET_NAME: ${{ vars.SECRETS_MANAGER_SECRET_NAME }}
      # Reintentos de cola/mini-retry de la SFC: opcionales por ambiente -- si el
      # Environment de GitHub no define la Variable, render_task_def.py cae a los
      # mismos defaults que Settings (app/core/config.py).
      QUEUE_RETRY_INTERVAL_MINUTES: ${{ vars.QUEUE_RETRY_INTERVAL_MINUTES }}
      QUEUE_MAX_RETRIES: ${{ vars.QUEUE_MAX_RETRIES }}
      SFC_MINI_RETRY_ATTEMPTS: ${{ vars.SFC_MINI_RETRY_ATTEMPTS }}
      SFC_MINI_RETRY_DELAY_SECONDS: ${{ vars.SFC_MINI_RETRY_DELAY_SECONDS }}
      # SMTP_HOST/SMTP_PORT/ALERT_EMAILS_ENABLED: opcionales por ambiente -- sin
      # override caen al mismo endpoint SES que antes estaba hardcodeado en la
      # plantilla. SMTP_FROM_EMAIL NO es opcional -- render_task_def.py aborta con
      # ValueError si falta (ver P1-08 ahí); se declara aquí igual, sin default.
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      ALERT_EMAILS_ENABLED: ${{ vars.ALERT_EMAILS_ENABLED }}
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
      GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{vars.GOOGLE_SHEET_RANGE}}
      GOOGLE_CATALOGS_SPREADSHEET_ID: ${{ vars.GOOGLE_CATALOGS_SPREADSHEET_ID }}
      # Subnets/SG privados para la task efímera del smoke post-deploy -- arrays
      # JSON de strings, ej. '["subnet-0123...", "subnet-0abc..."]' (ver cabecera).
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # boto3: el render ahora resuelve el sufijo real del secreto contra Secrets
      # Manager (secretsmanager:DescribeSecret) en vez de depender de un valor manual.
      - name: Instalar boto3
        run: pip install boto3

      - name: Renderizar Task Definitions (api + worker)
        run: |
          python scripts/render_task_def.py api ${{ inputs.environment }}
          python scripts/render_task_def.py worker ${{ inputs.environment }}

      # 🟢 FIX (auditoría adversarial v10, P0-04): deploy coordinado API+worker.
      # Antes se registraba y actualizaba API, luego se registraba y actualizaba
      # worker, y sólo al final se esperaba estabilidad de ambos -- si worker
      # fallaba después de que API ya había avanzado, el job terminaba en FAILED
      # con API en la release nueva y worker en la vieja, dos servicios que
      # comparten el mismo esquema de Redis quedando en versiones distintas sin
      # que nada lo revirtiera. Ahora: se capturan las revisiones actuales de
      # ambos servicios primero (para poder revertir), se registran AMBAS Task
      # Definitions nuevas antes de tocar cualquier servicio (si el registro de
      # una falla, ningún servicio se toca), y cada despliegue verifica
      # explícitamente que el servicio terminó en la revisión pedida -- no basta
      # con que `wait services-stable` salga en 0: si el circuit breaker propio
      # del servicio revierte solo a la revisión anterior, el servicio también
      # queda "stable" (sólo que en la vieja), y el wait no distingue eso de un
      # despliegue exitoso. Si worker falla después de que API ya avanzó, se
      # revierten AMBOS servicios a sus revisiones previas -- nunca queda uno en
      # la release nueva y el otro en la vieja.
      - name: Capturar Task Definitions actuales (para rollback coordinado)
        id: prev
        run: |
          PREV_API_TD=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_API \
            --query "services[0].taskDefinition" --output text)
          PREV_WORKER_TD=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_WORKER \
            --query "services[0].taskDefinition" --output text)
          echo "Revisión previa de api: $PREV_API_TD"
          echo "Revisión previa de worker: $PREV_WORKER_TD"
          echo "api=$PREV_API_TD" >> "$GITHUB_OUTPUT"
          echo "worker=$PREV_WORKER_TD" >> "$GITHUB_OUTPUT"

      - name: Registrar ambas Task Definitions antes de tocar cualquier servicio
        id: register
        run: |
          NEW_API_TD=$(aws ecs register-task-definition \
            --cli-input-json file://ecs-task-def-api-${{ inputs.environment }}.json \
            --query "taskDefinition.taskDefinitionArn" --output text)
          NEW_WORKER_TD=$(aws ecs register-task-definition \
            --cli-input-json file://ecs-task-def-worker-${{ inputs.environment }}.json \
            --query "taskDefinition.taskDefinitionArn" --output text)
          echo "Nueva revisión de api: $NEW_API_TD"
          echo "Nueva revisión de worker: $NEW_WORKER_TD"
          echo "api=$NEW_API_TD" >> "$GITHUB_OUTPUT"
          echo "worker=$NEW_WORKER_TD" >> "$GITHUB_OUTPUT"

      - name: Desplegar API y verificar estabilidad en la revisión pedida
        id: deploy_api
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_API \
            --task-definition "${{ steps.register.outputs.api }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_API
          DEPLOYED_TD=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_API \
            --query "services[0].taskDefinition" --output text)
          if [ "$DEPLOYED_TD" != "${{ steps.register.outputs.api }}" ]; then
            echo "❌ api quedó estable en $DEPLOYED_TD, no en la revisión pedida ${{ steps.register.outputs.api }} -- probable rollback automático del circuit breaker."
            exit 1
          fi

      - name: Rollback de API (si no estabilizó en la revisión pedida)
        if: failure() && steps.deploy_api.outcome == 'failure'
        run: |
          echo "Revirtiendo api a la revisión previa: ${{ steps.prev.outputs.api }}"
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_API \
            --task-definition "${{ steps.prev.outputs.api }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_API
          echo "api revertido -- worker nunca se tocó, ambos siguen en la release anterior."
          exit 1

      - name: Desplegar Worker y verificar estabilidad en la revisión pedida
        id: deploy_worker
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_WORKER \
            --task-definition "${{ steps.register.outputs.worker }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_WORKER
          DEPLOYED_TD=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_WORKER \
            --query "services[0].taskDefinition" --output text)
          if [ "$DEPLOYED_TD" != "${{ steps.register.outputs.worker }}" ]; then
            echo "❌ worker quedó estable en $DEPLOYED_TD, no en la revisión pedida ${{ steps.register.outputs.worker }} -- probable rollback automático del circuit breaker."
            exit 1
          fi

      - name: Rollback coordinado de API + Worker (si worker no estabilizó)
        if: failure() && steps.deploy_worker.outcome == 'failure'
        run: |
          echo "worker falló después de que api ya avanzó -- revirtiendo AMBOS servicios a sus revisiones previas para no dejar versiones mixtas."
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_API \
            --task-definition "${{ steps.prev.outputs.api }}" \
            --force-new-deployment
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_WORKER \
            --task-definition "${{ steps.prev.outputs.worker }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_API $ECS_SERVICE_NAME_WORKER
          echo "Ambos servicios revertidos a la release anterior."
          exit 1

      # 🟢 FIX (auditoría adversarial v10, P1-03/P1-05): `wait services-stable` sólo
      # prueba que ECS crea que las tasks están sanas -- no que el negocio funcione.
      # Se lanza una task efímera (misma imagen/Task Role que api, sin IAM nuevo
      # para la app) que corre scripts/post_deploy_smoke.py: valida Redis a través
      # del ALB compartido con CRM (de punta a punta) y S3 con un head_bucket real. El
      # lanzamiento usa boto3 directo (scripts/run_post_deploy_smoke.py) en vez de
      # construir a mano el JSON de --network-configuration/--overrides con bash.
      - name: Smoke funcional post-deploy (Redis a través del ALB + S3)
        id: smoke
        env:
          SMOKE_TASK_DEFINITION_ARN: ${{ steps.register.outputs.api }}
        run: |
          python scripts/run_post_deploy_smoke.py ${{ inputs.environment }}

      - name: Rollback coordinado de API + Worker (si el smoke funcional falló)
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "El smoke funcional post-deploy falló -- revirtiendo AMBOS servicios a sus revisiones previas."
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_API \
            --task-definition "${{ steps.prev.outputs.api }}" \
            --force-new-deployment
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service $ECS_SERVICE_NAME_WORKER \
            --task-definition "${{ steps.prev.outputs.worker }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services $ECS_SERVICE_NAME_API $ECS_SERVICE_NAME_WORKER
          echo "Ambos servicios revertidos a la release anterior."
          exit 1

  # ===========================================================================
  # (Opcional) TERRAFORM — si el IaC central usa Terraform, el `terraform
  # plan`/`apply` de ECR, ECS, ALB, ElastiCache, IAM, etc. vive en el
  # repositorio central de infraestructura del equipo, no en éste — el
  # informe de auditoría (sección 6) es explícito en que la infraestructura
  # operativa debe vivir ahí. Este workflow asume que esos recursos ya
  # existen y sólo publica/despliega la aplicación sobre ellos.
  # ===========================================================================
