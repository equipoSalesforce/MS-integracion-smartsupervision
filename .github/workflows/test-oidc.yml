# =============================================================================
# WORKFLOW DESECHABLE — solo para probar la autenticación OIDC de GitHub
# Actions contra AWS_DEPLOY_ROLE_ARN, sin depender de que el resto de la
# infraestructura (ECR, ECS, ElastiCache) ya exista.
#
# Vive en una rama aparte (test-oidc), nunca en main. Bórrala junto con la
# rama una vez confirmes que el rol autentica correctamente.
# =============================================================================

name: Test OIDC Auth

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente cuyo AWS_DEPLOY_ROLE_ARN se va a probar"
        required: true
        type: choice
        options: [ci, dev, qa, prod]
        default: ci

permissions:
  id-token: write
  contents: read

jobs:
  test-auth:
    name: Probar autenticación OIDC (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirmar identidad asumida
        run: aws sts get-caller-identity
